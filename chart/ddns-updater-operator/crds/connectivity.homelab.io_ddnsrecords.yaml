---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: ddnsrecords.connectivity.homelab.io
spec:
  group: connectivity.homelab.io
  names:
    kind: DDNSRecord
    listKind: DDNSRecordList
    plural: ddnsrecords
    shortNames:
    - ddns
    singular: ddnsrecord
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .spec.domain
      name: Domain
      type: string
    - jsonPath: .spec.host
      name: Host
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DDNSRecord is the Schema for the ddnsrecords API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DDNSRecordSpec defines the desired state of DDNSRecord
            properties:
              config:
                additionalProperties:
                  x-kubernetes-preserve-unknown-fields: true
                description: |-
                  Config holds the provider-specific settings, merged verbatim into the
                  ddns-updater config entry. Keys and value types are whatever the
                  provider documents (see the ddns-updater docs/ directory), e.g.
                  {"zone_identifier": "abc", "proxied": true, "ttl": 300}.

                  Never put credentials here — the whole entry lands in a ConfigMap.
                  Use configFrom for anything secret.

                  The reserved keys provider, domain, host, ip_version and ipv6_suffix
                  are owned by the fields above and rejected here.
                type: object
              configFrom:
                description: |-
                  ConfigFrom injects provider settings from Secrets. Each item sets one
                  key of the ddns-updater config entry to the value of a Secret key, so
                  credentials never appear in the DDNSRecord itself.
                items:
                  description: ConfigFromSource maps a Secret key onto one provider
                    setting
                  properties:
                    name:
                      description: |-
                        Name is the key to set in the ddns-updater config entry, e.g.
                        "token", "app_key", "password".
                      pattern: ^[a-z0-9][a-z0-9._-]*$
                      type: string
                    secretKeyRef:
                      description: SecretKeyRef selects the Secret key holding the
                        value
                      properties:
                        key:
                          description: Key within the secret's data
                          type: string
                        name:
                          description: Name of the secret
                          type: string
                        namespace:
                          description: Namespace of the secret (defaults to the DDNSRecord
                            namespace)
                          type: string
                      required:
                      - key
                      - name
                      type: object
                  required:
                  - name
                  - secretKeyRef
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              domain:
                description: Domain is the base domain (e.g., example.com)
                type: string
              host:
                description: Host is the subdomain or @ for root
                type: string
              ipVersion:
                default: ipv4
                description: |-
                  IPVersion specifies which IP version to update
                  ipv4_and_ipv6 creates two entries (one for each) since ddns-updater doesn't support both in one
                enum:
                - ipv4
                - ipv6
                - ipv4_or_ipv6
                - ipv4_and_ipv6
                type: string
              ipv6Suffix:
                description: |-
                  IPv6Suffix is the IPv6 interface identifier suffix to use instead of the auto-detected one.
                  This is useful when the LoadBalancer has a static IPv6 suffix different from the node's SLAAC address.
                  Format: "0:0:0:0:0:0:0:166/64" or "::166/64" for suffix 166 with /64 prefix
                  If empty, the raw public IPv6 address obtained is used.
                type: string
              provider:
                description: |-
                  Provider is the ddns-updater provider name, e.g. "ovh", "cloudflare",
                  "duckdns". Any provider supported by the running ddns-updater is
                  accepted: the operator passes the name through verbatim rather than
                  validating it against a built-in list, so a provider added upstream
                  works without an operator release. An unrecognised name is reported as
                  a warning Event, not a rejection.
                pattern: ^[a-z0-9][a-z0-9._-]*$
                type: string
            required:
            - domain
            - host
            - provider
            type: object
          status:
            description: DDNSRecordStatus defines the observed state of DDNSRecord
            properties:
              conditions:
                description: Conditions represent the current state of the DDNSRecord
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSyncedAt:
                description: LastSyncedAt is the timestamp of the last successful
                  sync
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the generation of the DDNSRecord spec that was
                  last reconciled. If it matches metadata.generation, the spec has been
                  fully processed and the controller can skip redundant work.
                format: int64
                type: integer
              ready:
                description: Ready indicates if the record has been synced to the
                  ConfigMap
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
